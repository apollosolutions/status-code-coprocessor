extend schema @link(url: "https://specs.apollo.dev/federation/v2.6", import: ["@policy", "@requiresScopes", "@authenticated"])

type Query {
  users: [User]
  userById(id: ID!): User
  items: [Item] @requiresScopes(scopes: [["read:client_grants"]])
  restaurent(restaurant: String!): String
}

type User {
  id: ID! @authenticated
  name: String @policy(policies: [["ADDED_2024_01"]])
}

type Item {
  name: String!
}
